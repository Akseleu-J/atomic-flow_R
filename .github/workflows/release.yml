name: Release (portable af binaries)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: af-windows-x64.zip
            binary: af.exe
            archive: zip
          - os: ubuntu-24.04
            artifact: af-linux-x64.tar.gz
            binary: af
            archive: tar
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal
      - name: Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwayland-dev pkg-config
      - name: Record source
        shell: bash
        run: |
          mkdir -p dist
          git rev-parse HEAD > dist/commit.txt
      - name: Build release binary
        working-directory: rust
        env:
          CARGO_BUILD_JOBS: "2"
          CARGO_INCREMENTAL: "0"
        run: cargo build --release -p af-cli --locked
      - name: Smoke the binary
        shell: bash
        run: |
          rust/target/release/${{ matrix.binary }} --version
          rust/target/release/${{ matrix.binary }} self-test
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        if: github.event_name == 'workflow_dispatch'
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: github.event_name == 'workflow_dispatch'
        with:
          node-version: '22'
      - name: Build and smoke engineer beta archive
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -o pipefail
          npm --prefix ts/af-client ci --ignore-scripts --no-fund --no-audit
          npm --prefix ts/af-client run build
          npm --prefix ts/af-studio ci --ignore-scripts --no-fund --no-audit
          npm --prefix ts/af-studio run build
          mkdir -p beta
          python tools/package_beta.py --binary rust/target/release/${{ matrix.binary }} \
            --studio ts/af-studio/dist --output beta/atomic-flow-beta-${{ matrix.os }}.zip \
            | tee beta/smoke.txt
          tail -n 1 beta/smoke.txt > beta/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: engineer-beta-${{ matrix.os }}
          path: beta/
      - name: Package (windows zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Copy-Item rust/target/release/af.exe dist/
          Compress-Archive -Path dist/af.exe, dist/commit.txt -DestinationPath dist/${{ matrix.artifact }}
      - name: Package (linux tar.gz)
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          cp rust/target/release/af dist/
          cp dist/commit.txt .
          tar -czf dist/${{ matrix.artifact }} -C dist af commit.txt
      - name: SHA256SUMS
        shell: bash
        run: |
          cd dist
          sha256sum ${{ matrix.artifact }} > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.os }}
          path: dist/

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate changelog from tagged commits
        run: |
          { echo "# atomic-flow ${{ github.ref_name }}"
            echo
            echo "Portable af binaries (single executable, embedded dashboard)."
            echo "Verify with SHA256SUMS.txt; commit of record in commit.txt."
            echo
            echo "## Changes"
            git log --oneline "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD" || git log --oneline -20
          } > dist/CHANGELOG.md
          cat dist/CHANGELOG.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "atomic-flow ${{ github.ref_name }}" \
            --notes-file dist/CHANGELOG.md \
            dist/af-windows-x64.zip dist/af-linux-x64.tar.gz dist/SHA256SUMS.txt
